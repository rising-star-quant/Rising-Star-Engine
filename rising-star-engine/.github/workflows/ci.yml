name: CI Pipeline - Rising Star v2.0

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  test:
    name: Unit Tests & Code Validation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "rising-star-engine/requirements.txt" ]; then
            pip install -r rising-star-engine/requirements.txt
          fi

      - name: Run Pytest Suite
        env:
          RSTE_ENV: testing
        run: |
          if [ -d "rising-star-engine" ]; then
            export PYTHONPATH=rising-star-engine
            python -m pytest rising-star-engine/tests/ -v --durations=10
          else
            export PYTHONPATH=.
            python -m pytest tests/ -v --durations=10
          fi
